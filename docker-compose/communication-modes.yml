# Maitask control-plane communication examples.
#
# Runtime is not defined in this Compose file. Install Runtime from a native
# binary release and expose HTTP/gRPC on the host or on an internal network:
#
#   RUNTIME_HTTP_URL=http://host.docker.internal:8080
#   RUNTIME_GRPC_URLS=http://host.docker.internal:50051
#
# Then start this stack for Plane, Frontend, PostgreSQL, and Redis.

version: "3.8"

services:
  plane:
    image: maitask/plane:latest
    container_name: maitask-plane
    environment:
      SERVER_ADDRESS: 0.0.0.0:8001
      DATABASE_URL: postgresql://postgres:password@postgres:5432/maitask
      REDIS_URL: redis://redis:6379
      JWT_SECRET: replace-with-a-random-secret-at-least-32-chars
      SERVICE_AUTH_ENABLED: "true"
      SERVICE_SECRETS: runtime:runtime-shared-secret
      RUNTIME_HTTP_URL: ${RUNTIME_HTTP_URL:-http://host.docker.internal:8080}
      RUNTIME_GRPC_URLS: ${RUNTIME_GRPC_URLS:-http://host.docker.internal:50051}
      RUST_LOG: info,maitask_plane=debug
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - maitask

  plane-frontend:
    image: maitask/plane-frontend:latest
    container_name: maitask-plane-frontend
    environment:
      VITE_PLANE_API_URL: /api
    ports:
      - "3000:80"
    depends_on:
      - plane
    networks:
      - maitask

  postgres:
    image: postgres:16-alpine
    container_name: maitask-postgres
    environment:
      POSTGRES_DB: maitask
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d maitask"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - maitask

  redis:
    image: redis:7-alpine
    container_name: maitask-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data
    networks:
      - maitask

networks:
  maitask:

volumes:
  postgres-data:
  redis-data:
